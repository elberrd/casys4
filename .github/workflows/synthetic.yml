# Hourly synthetic check of production HTTP health. Public URLs only; no secrets.
# Schedule runs from the default branch after merge. workflow_dispatch works from
# any branch that contains this file.
name: Synthetic health check

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    name: Production endpoints return 200
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production /pt/login
        run: curl -fsS --max-time 20 -o /dev/null -w "login %{http_code}\n" https://casys4.vercel.app/pt/login
      - name: Check Convex /version
        run: curl -fsS --max-time 20 -o /dev/null -w "convex-version %{http_code}\n" https://pleasant-mosquito-546.convex.cloud/version
